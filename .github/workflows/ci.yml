name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install dependencies from lockfile
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          # --with-deps sometimes fails on transient Google Chrome apt Hash Sum mismatch.
          # Retry a few times, then fall back to browser-only install (ubuntu-latest usually has libs).
          if ! mise exec -- pnpm exec playwright install --with-deps chromium; then
            echo "Playwright --with-deps failed; cleaning apt lists and retrying..."
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get clean
            if ! mise exec -- pnpm exec playwright install --with-deps chromium; then
              echo "Playwright --with-deps still failing; installing browser without OS deps"
              mise exec -- pnpm exec playwright install chromium
            fi
          fi

      - name: Verify types, build, accessibility, and browser behavior
        run: mise exec -- pnpm verify

      - name: Check documentation and built-site links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ./dist
            --exclude '^https://matharts\.cn/?$'
            README.md
            public/llms.txt
            "dist/**/*.html"
          fail: true
          failIfEmpty: true
