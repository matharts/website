name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - name: Install dependencies from lockfile
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Install stable Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Run Lighthouse quality gate
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: mise exec -- pnpm lighthouse:check

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.run_attempt }}
          path: output/lighthouse/
          if-no-files-found: warn
          retention-days: 14
